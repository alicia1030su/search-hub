name: Upgrade and update fault injection

# Real cross-version upgrades and real update failures, on the real operating
# systems. This workflow exists because "it works from the source tree" is not
# evidence that a downloaded package can be upgraded.
#
# It downloads published packages from GitHub Releases, so the upgrade paths are
# the ones a user actually faces:
#   v0.1.4-beta.6 -> current      (oldest package still installable)
#   v0.1.5-beta.1 -> current
#   v0.1.7-beta.3 -> current      (the release before the v0.1.8 stable)
#   v0.1.8-beta.1 -> current      (beta to stable of the v0.1.8 line)
#   v0.1.8        -> current
#   v0.1.10       -> current      (health-budget migration)
#   v0.1.11       -> current      (previous Stable; exercises migrations 0010-0011)
#
# The immediately previous Stable path is the one most users take. It must
# upgrade the same data directory without losing keys, cache or evaluation
# datasets, including the v0.1.12 connect-ledger migration.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "apps/api/src/services/updater.ts"
      - "apps/api/src/services/health*.ts"
      - ".github/workflows/upgrade.yml"
  push:
    branches: [main]

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.2"
  PNPM_VERSION: "12.18.0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

permissions:
  contents: read

jobs:
  upgrade:
    name: Cross-version upgrade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The "current" side of every path is built here, so a PR is tested before
      # it is released. The "old" side comes from the published releases.
      - name: Build the current package
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.os == 'windows-latest' && 'windows-x64' || 'linux-x64' }}
          # Stamp the current candidate ahead of the published releases so the
          # updater performs a real forward move and the asset name matches.
          SEARCH_HUB_VERSION: 0.1.13-ci
        run: node packaging/build-package.mjs

      - name: Upgrade v0.1.4-beta.6 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.4-beta.6 --to "$TARGET" --port 8910

      - name: Upgrade v0.1.5-beta.1 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.5-beta.1 --to "$TARGET" --port 8920

      # The release immediately before the one being shipped. `upgrade-matrix`
      # resolves the tag at run time, so this stays correct as versions move.
      - name: Upgrade v0.1.7-beta.3 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.7-beta.3 --to "$TARGET" --port 8925

      # The previous *stable* release: the upgrade most users will actually do.
      - name: Upgrade v0.1.8 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.8 --to "$TARGET" --port 8927

      # The immediately previous Stable release. This path also exercises the
      # v0.1.11 health-budget migration against real v0.1.10 state.
      - name: Upgrade v0.1.10 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.10 --to "$TARGET" --port 8928

      # The immediately previous Stable release. This real published-package
      # upgrade also exercises migrations 0010-0011 against v0.1.11 state.
      - name: Upgrade v0.1.11 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.11 --to "$TARGET" --port 8929

      - name: Upgrade v0.1.12 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.12 --to "$TARGET" --port 8931

      # beta -> stable of the same minor version: the path an operator on the
      # beta channel actually takes, and the one where the updater must accept
      # "release over prerelease".
      - name: Upgrade v0.1.8-beta.1 → current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=$(find dist/package -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)
          test -n "$TARGET" || { echo "no package was built"; exit 1; }
          echo "target package: $TARGET"
          node packaging/upgrade-matrix.mjs --from v0.1.8-beta.1 --to "$TARGET" --port 8926

      - name: Update fault injection
        shell: bash
        env:
          FAULT_PORT: "8930"
          # No mount permission on the runner; the disk-full case reports a skip
          # rather than a pass.
          FAULT_SKIP_DISK: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
        run: node packaging/launcher/updater-faults.mjs

      - name: Updater install and rollback
        shell: bash
        run: node packaging/launcher/updater-test.mjs

  supply-chain:
    name: Supply-chain audit (published release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only meaningful for a tag that already exists; on a PR it audits the last
    # published beta, which is what a user would actually download.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Downloads every asset, verifies SHA256SUMS against the bytes, cross-checks
      # GitHub's own per-asset digest, and inspects archive entries and modes.
      # The tag is resolved at run time: a version hardcoded here would keep
      # auditing an old release while reporting green.
      - name: Audit the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/supply-chain-audit.mjs
