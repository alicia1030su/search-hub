name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.20.0"
  PNPM_VERSION: "12.18.0"

jobs:
  quality:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Database migration smoke test
        run: |
          node --import tsx -e "
          const { createDb, runMigrations } = await import('./packages/db/src/index.ts');
          const db = createDb({ file: ':memory:' });
          const result = runMigrations(db.sqlite);
          console.log('migrations applied:', result.applied.length);
          db.close();
          "

  build:
    name: Build web bundle and container image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and server bundles
        run: pnpm build

      - name: Verify the built artifacts exist
        run: |
          test -f apps/web/dist/index.html
          test -f apps/api/dist/server.mjs
          test -f apps/api/migrations/0001_init.sql
          test -f packages/mcp/dist/stdio.mjs

      - name: Production-only install and boot
        run: |
          pnpm install --frozen-lockfile --prod
          test ! -d node_modules/vite
          SEARCH_HUB_DATA_DIR="$RUNNER_TEMP/sh-prod" \
          SEARCH_HUB_PORT=8788 \
          SEARCH_HUB_COOKIE_SECURE=false \
          node apps/api/dist/server.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8788/api/setup/status | tee /dev/stderr | grep -q '"setupTokenRequired":true'
          test -f "$RUNNER_TEMP/sh-prod/setup-token"
          kill "$SERVER_PID" || true

      - name: Build container image
        run: docker build -t search-hub:ci .

      - name: Start container and wait for health
        run: |
          docker run -d --name search-hub-ci -p 8787:8787 \
            -e SEARCH_HUB_ENCRYPTION_KEY=$(openssl rand -hex 32) \
            search-hub:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              echo "healthy after ${i} tries"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/api/setup/status | grep -q '"setupTokenRequired":true'
          test "$(docker exec search-hub-ci id -u)" = "1001"
          docker exec search-hub-ci test -f /app/data/setup-token

      - name: Stop container
        if: always()
        run: docker rm -f search-hub-ci || true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high and critical)
        run: pnpm audit --audit-level high
