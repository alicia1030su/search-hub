name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.2"
  PNPM_VERSION: "12.18.0"

jobs:
  quality:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The catalog is the source of truth; the docs must not contradict it.
      # This blocks a merge when a README count, a "not implemented" claim or a
      # live_tested claim disagrees with the code.
      - name: Documentation consistency (catalog vs docs)
        run: pnpm check:matrix && pnpm check:docs

      - name: Unit and integration tests
        run: pnpm test

      - name: Database migration smoke test
        run: |
          node --import tsx -e "
          const { createDb, runMigrations } = await import('./packages/db/src/index.ts');
          const db = createDb({ file: ':memory:' });
          const result = runMigrations(db.sqlite);
          console.log('migrations applied:', result.applied.length);
          db.close();
          "

  build:
    name: Build web and server bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and server bundles
        run: pnpm build

      - name: Verify the built artifacts exist
        run: |
          test -f apps/web/dist/index.html
          test -f apps/api/dist/server.mjs
          test -f apps/api/migrations/0001_init.sql
          test -f packages/mcp/dist/stdio.mjs

      - name: Production-only install and boot
        run: |
          pnpm install --frozen-lockfile --prod
          test ! -d node_modules/vite
          # The bundle keeps third-party packages external. Prove every import
          # resolves from apps/api/dist in the production tree, before boot.
          node scripts/check-runtime-imports.mjs
          SEARCH_HUB_DATA_DIR="$RUNNER_TEMP/sh-prod" \
          SEARCH_HUB_PORT=8788 \
          SEARCH_HUB_COOKIE_SECURE=false \
          node apps/api/dist/server.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8788/api/setup/status | tee /dev/stderr | grep -q '"setupTokenRequired":true'
          test -f "$RUNNER_TEMP/sh-prod/setup-token"
          kill "$SERVER_PID" || true

      # The container image, the compose stack and the 11-item container
      # acceptance run live in .github/workflows/docker.yml. They are kept out
      # of this job on purpose: `pnpm install --prod` above prunes the workspace
      # node_modules, and a container build in the same job would make it
      # ambiguous whether a failure comes from the host tree or the image.

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the scanner checks every reachable commit, not just HEAD.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Secret scan (working tree and every git ref)
        run: node scripts/secret-scan.mjs

  launcher:
    name: Launcher lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drives the real launcher against throwaway stub servers: start, second
      # instance, stale lock, foreign pid, health timeout, stop.
      - name: Run launcher lifecycle tests
        # The launcher shells out to node directly; the lifecycle test sets its
        # own DATA_DIR per case and never touches a real instance.
        run: node packaging/launcher/lifecycle-test.mjs
