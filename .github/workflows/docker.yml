name: Docker

# Container acceptance for the production image. This workflow is the only
# place that builds the image and runs the compose stack — the `build` job in
# ci.yml deliberately stops at the host-level production install so that a red
# result here always means "the container is broken", not "the runner tree is".
#
# Every check below is also runnable locally on any Linux host with Docker:
#   bash scripts/docker-verify.sh
# See docs/docker-verification.md for the per-item expectations.

on:
  push:
    branches: [main, master]
  # No path filter on pushes or pull requests: every main SHA, including a
  # docs/evidence-only commit, must produce an actual Docker acceptance run.
  pull_request:
  workflow_dispatch:

# One compose project per run, and never two runs of the same ref at once: a
# shared volume or a shared published port would make the result meaningless.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: search-hub:ci
  PROJECT: sh-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Host-level gate. The container job must not start when the code cannot
  # typecheck, lint, test or build: otherwise a broken image would be the first
  # signal, which is the most expensive place to discover it.
  quality:
    name: Install, typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Print toolchain versions
        run: |
          node -v
          pnpm -v
          corepack --version || true

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Build web and server bundles
        run: pnpm build

      - name: Verify build artifacts exist
        run: |
          test -f apps/api/dist/server.mjs
          test -f packages/mcp/dist/stdio.mjs
          test -d apps/web/dist

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web and server bundles
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the E2E suite
        run: pnpm test:e2e

  container:
    name: Image, compose stack, MCP and 11-item acceptance
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (used by the verification script's JSON helper)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image (with layer cache)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image size and id
        run: |
          docker images --format 'image={{.Repository}}:{{.Tag}} id={{.ID}} size={{.Size}}' "$IMAGE"

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Install trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v0.76.2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/trivy" --version

      - name: Run the 11-item container acceptance
        env:
          # Reuse the image built above; the script still runs every other item.
          SEARCH_HUB_VERIFY_SKIP_BUILD: "1"
          SEARCH_HUB_VERIFY_IMAGE: ${{ env.IMAGE }}
          SEARCH_HUB_VERIFY_PROJECT: ${{ env.PROJECT }}
          SEARCH_HUB_VERIFY_REQUIRE_SCAN: "1"
          # HIGH/CRITICAL that the base image can actually fix must be zero;
          # unfixed ones are ignored by default so the gate stays actionable.
          SEARCH_HUB_VERIFY_MAX_HIGH: "0"
          SEARCH_HUB_VERIFY_MAX_CRITICAL: "0"
          SEARCH_HUB_VERIFY_REPORT_DIR: ${{ runner.temp }}/docker-report
          # Leave the stack up so the diagnostics step below can dump its logs;
          # the final step of the job removes it in every case.
          SEARCH_HUB_VERIFY_KEEP: "1"
        run: bash scripts/docker-verify.sh

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-report
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the acceptance summary
        if: always()
        run: |
          {
            echo "## Container acceptance"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP"/docker-report/docker-verify-*.results 2>/dev/null || echo "no results file"
            echo '```'
            echo ""
            echo "Image: \`$IMAGE\`"
            echo "Project: \`$PROJECT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose -p "$PROJECT" logs --no-color --tail 200 || true
          docker ps -a || true
          docker volume ls || true

      - name: Remove the compose project and volume
        if: always()
        run: |
          docker compose -p "$PROJECT" down -v --remove-orphans || true
          docker image rm -f "$IMAGE" || true
          # Belt and braces: remove any volume the project left behind.
          leftovers=$(docker volume ls --format '{{.Name}}' | grep -F "${PROJECT}_" || true)
          [ -n "$leftovers" ] && echo "$leftovers" | xargs -r docker volume rm -f || true
          docker volume ls | grep -F "$PROJECT" || echo "no leftover volumes"
