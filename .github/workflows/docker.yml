name: Docker

# Container acceptance for the production image. This workflow is the only
# place that builds the image and runs the compose stack — the `build` job in
# ci.yml deliberately stops at the host-level production install so that a red
# result here always means "the container is broken", not "the runner tree is".
#
# Every check below is also runnable locally on any Linux host with Docker:
#   bash scripts/docker-verify.sh
# See docs/docker-verification.md for the per-item expectations.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# One compose project per run, and never two runs of the same ref at once: a
# shared volume or a shared published port would make the result meaningless.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: search-hub:ci
  PROJECT: sh-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  container:
    name: Image, compose stack and 10-item acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image size and id
        run: |
          docker images --format 'image={{.Repository}}:{{.Tag}} id={{.ID}} size={{.Size}}' "$IMAGE"

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Install trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v0.76.2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/trivy" --version

      - name: Run the 10-item container acceptance
        env:
          # Reuse the image built above; the script still runs every other item.
          SEARCH_HUB_VERIFY_SKIP_BUILD: "1"
          SEARCH_HUB_VERIFY_IMAGE: ${{ env.IMAGE }}
          SEARCH_HUB_VERIFY_PROJECT: ${{ env.PROJECT }}
          SEARCH_HUB_VERIFY_REQUIRE_SCAN: "1"
          # HIGH/CRITICAL that the base image can actually fix must be zero;
          # unfixed ones are ignored by default so the gate stays actionable.
          SEARCH_HUB_VERIFY_MAX_HIGH: "0"
          SEARCH_HUB_VERIFY_MAX_CRITICAL: "0"
          SEARCH_HUB_VERIFY_REPORT_DIR: ${{ runner.temp }}/docker-report
          # Leave the stack up so the diagnostics step below can dump its logs;
          # the final step of the job removes it in every case.
          SEARCH_HUB_VERIFY_KEEP: "1"
        run: bash scripts/docker-verify.sh

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-report
          if-no-files-found: warn
          retention-days: 14

      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose -p "$PROJECT" logs --no-color --tail 200 || true
          docker ps -a || true
          docker volume ls || true

      - name: Remove the compose project and volume
        if: always()
        run: |
          docker compose -p "$PROJECT" down -v --remove-orphans || true
          docker image rm -f "$IMAGE" || true
          # Belt and braces: remove any volume the project left behind.
          leftovers=$(docker volume ls --format '{{.Name}}' | grep -F "${PROJECT}_" || true)
          [ -n "$leftovers" ] && echo "$leftovers" | xargs -r docker volume rm -f || true
          docker volume ls | grep -F "$PROJECT" || echo "no leftover volumes"
