name: Provider live verification

# Real third-party calls only. Deliberately NOT triggered by push or PR:
# the keyless Docker acceptance must never depend on a provider credential,
# and a provider credential must never be present in that workflow.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Which provider to call (auto = every secret that exists)"
        required: true
        default: auto
        type: choice
        options: [auto, tavily, bocha, brave]

permissions:
  contents: read

concurrency:
  group: provider-live-${{ github.ref }}
  cancel-in-progress: false

# Two failure modes look alike in the Deployments list but mean different things:
#
# 1. "Branch ... is not allowed to deploy to provider-live due to environment
#    protection rules" — the run never started. The environment only allows
#    `main`; dispatching from a feature branch is the cause, not a missing key.
# 2. "No provider secret is configured for this run" — the run started, found no
#    credential, and made no vendor call. That is an unverified state, not a
#    product defect.
#
# Neither is a production deployment failure: this workflow never deploys
# anything. It only calls vendor APIs.
jobs:
  live:
    name: Real provider call (${{ inputs.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-live
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Keys are provided ONLY through the environment. There is deliberately
      # no --key option: a value on the command line appears in argv of this
      # process and of any child, and can be echoed by shell tracing. A missing
      # secret is SKIP (exit 2), not a pass.
      #
      # `::add-mask::` registers extra transformed values so the GitHub job log
      # masks them too. The script also scrubs everything it prints; the log
      # files are scrubbed again before any artifact is uploaded.
      - name: Call the configured providers
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SELECTED: ${{ inputs.provider }}
        run: |
          set -uo pipefail
          # Register the exact values as masks for the job log. Encoded/base64
          # variants are handled by the scrubber, not by masking.
          for value in "${TAVILY_API_KEY:-}" "${BOCHA_API_KEY:-}" "${BRAVE_API_KEY:-}"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          failures=0
          ran=0
          run_provider() {
            name=$1
            key=$2
            if [ "$SELECTED" != "auto" ] && [ "$SELECTED" != "$name" ]; then
              return 0
            fi
            if [ -z "$key" ]; then
              echo "SKIP: $name has no secret in the provider-live environment"
              return 0
            fi
            ran=$((ran + 1))
            echo "::group::$name"
            # Run through tsx directly so the TypeScript adapters load without
            # the script's node->tsx re-exec child. Fewer processes holding the
            # credential means a smaller leak surface.
            if pnpm exec tsx tests/scripts/provider-live.mjs --provider "$name" 2>&1 | tee -a "provider-$name.log"; then
              echo "LIVE PASSED: $name"
            else
              echo "::error::$name live call failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          run_provider tavily "${TAVILY_API_KEY:-}"
          run_provider bocha "${BOCHA_API_KEY:-}"
          run_provider brave "${BRAVE_API_KEY:-}"
          echo "providers called: $ran, failures: $failures"
          if [ "$ran" -eq 0 ]; then
            # This is NOT a deployment failure and NOT a product defect: no
            # credential exists in the provider-live environment. The run must
            # still be non-green, because "we could not verify anything" is not
            # evidence that the adapters work. The message is what makes the red
            # X readable instead of looking like a broken release.
            {
              echo "## Provider live verification: BLOCKED (no credential)"
              echo ""
              echo 'No secret was available in the `provider-live` environment, so **no real vendor call was made**.'
              echo ""
              echo "| Provider | Secret | State |"
              echo "|---|---|---|"
              echo "| tavily | `TAVILY_API_KEY` | $([ -n "${TAVILY_API_KEY:-}" ] && echo present || echo missing) |"
              echo "| bocha | `BOCHA_API_KEY` | $([ -n "${BOCHA_API_KEY:-}" ] && echo present || echo missing) |"
              echo "| brave | `BRAVE_API_KEY` | $([ -n "${BRAVE_API_KEY:-}" ] && echo present || echo missing) |"
              echo ""
              echo "What this run proves: **nothing about provider compatibility**."
              echo "What it does not mean: the application, the image, or the release is broken."
              echo ""
              echo "To make this run meaningful, add a real key as an environment secret, then re-run:"
              echo '```'
              echo 'gh secret set TAVILY_API_KEY --env provider-live   # or BOCHA_API_KEY / BRAVE_API_KEY'
              echo '```'
              echo 'Providers without a key stay `documented` (implemented, never called the vendor).'
              echo 'They are not silently promoted to `live_tested`.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=BLOCKED: no provider credential::No TAVILY/BOCHA/BRAVE key exists in the provider-live environment, so no real vendor call was made. This is an unverified state, not a product failure. See the job summary for how to supply a key."
            exit 1
          fi
          exit $((failures > 0 ? 1 : 0))

      # Artifact file contents are NOT covered by GitHub's log masking. A vendor
      # could echo a credential into an error body or a result title, so scrub
      # the files in place (using the same helper as the script) before upload.
      - name: Scrub provider logs before upload
        id: scrub
        if: always()
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          # Fail closed: if scrubbing fails for any reason, the artifact must
          # not be uploaded with raw content.
          node tests/scripts/scrub-provider-logs.mjs provider-*.log
      - name: Upload scrubbed provider logs (7 days)
        if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: provider-live-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-*.log
          if-no-files-found: ignore
          retention-days: 7
