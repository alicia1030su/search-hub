name: Provider live verification

# Real third-party calls only. Deliberately NOT triggered by push or PR:
# the keyless Docker acceptance must never depend on a provider credential,
# and a provider credential must never be present in that workflow.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Which provider to call (auto = every secret that exists)"
        required: true
        default: auto
        type: choice
        options: [auto, tavily, bocha, brave]

permissions:
  contents: read

concurrency:
  group: provider-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    name: Real provider call (${{ inputs.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-live
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Keys are provided ONLY through the environment. The script reads
      # TAVILY_API_KEY / BOCHA_API_KEY / BRAVE_API_KEY itself, so the value never
      # appears in argv (process arguments are readable by other processes on
      # the runner) and never in the command echo. A missing secret is SKIP
      # (exit 2), not a pass.
      - name: Call the configured providers
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SELECTED: ${{ inputs.provider }}
        run: |
          set -uo pipefail
          failures=0
          ran=0
          run_provider() {
            name=$1
            key=$2
            if [ "$SELECTED" != "auto" ] && [ "$SELECTED" != "$name" ]; then
              return 0
            fi
            if [ -z "$key" ]; then
              echo "SKIP: $name has no secret in the provider-live environment"
              return 0
            fi
            ran=$((ran + 1))
            echo "::group::$name"
            if node tests/scripts/provider-live.mjs --provider "$name" 2>&1 | tee -a "provider-$name.log"; then
              echo "LIVE PASSED: $name"
            else
              echo "::error::$name live call failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          run_provider tavily "${TAVILY_API_KEY:-}"
          run_provider bocha "${BOCHA_API_KEY:-}"
          run_provider brave "${BRAVE_API_KEY:-}"
          echo "providers called: $ran, failures: $failures"
          if [ "$ran" -eq 0 ]; then
            echo "::error::No provider secret is configured for this run"
            exit 1
          fi
          exit $((failures > 0 ? 1 : 0))

      # Logs are useful for debugging but must never include a key. The script
      # already redacts credentials; this step keeps the files inside the run
      # instead of uploading them as long-lived artifacts.
      - name: Upload provider logs (7 days)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: provider-live-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-*.log
          if-no-files-found: ignore
          retention-days: 7
