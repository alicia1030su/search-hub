name: Release packages

# Builds the Windows and Linux standalone packages, verifies each one by
# actually starting it, and only then publishes a prerelease.
#
# Triggered by a tag like v0.1.4-beta.1. Everything runs on the real target OS:
# a package that only "builds" is not evidence that it starts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.22.2"
  PNPM_VERSION: "12.18.0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Windows package
        shell: bash
        env:
          PACKAGE_TARGET: windows-x64
        run: node packaging/build-package.mjs

      - name: Verify the package starts and serves REST + MCP
        shell: bash
        run: node packaging/verify-package.mjs windows-x64

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-x64
          path: |
            dist/package/*windows-x64.zip
            dist/package/*windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runtime_url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-x64.tar.xz
          - arch: arm64
            runtime_url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-arm64.tar.xz
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # arm64 packages must bundle an arm64 runtime; the runner is x64.
      - name: Fetch the target Node runtime
        run: |
          curl -fsSL "${{ matrix.runtime_url }}" -o /tmp/node.tar.xz
          mkdir -p /tmp/node-runtime
          tar -xJf /tmp/node.tar.xz -C /tmp/node-runtime --strip-components=1
          cp /tmp/node-runtime/bin/node /tmp/node-${{ matrix.arch }}

      - name: Build the Linux package
        env:
          PACKAGE_TARGET: linux-${{ matrix.arch }}
          PACKAGE_NODE_BIN: /tmp/node-${{ matrix.arch }}
        run: node packaging/build-package.mjs

      - name: Verify the package starts and serves REST + MCP
        run: node packaging/verify-package.mjs linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/package/*linux-${{ matrix.arch }}.tar.gz
            dist/package/*linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish prerelease
    runs-on: ubuntu-latest
    needs: [windows, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7.0.1
        with:
          path: artifacts

      # A single SHA256SUMS covering every asset, so a user can verify one file.
      - name: Assemble SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} \; \
            | sed 's#  \./[^/]*/#  #' | sort -k2 > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Create the prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*/*.zip
            artifacts/*/*.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true
