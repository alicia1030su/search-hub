name: Promote release candidate

# This workflow never builds program packages or container images. It promotes
# the exact bytes and image digest produced by release-candidate.yml for the
# annotated Stable tag's commit.
on:
  push:
    tags: ["v0.1.15"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable annotated Stable tag to recover"
        required: true
        type: string
        default: "v0.1.15"

concurrency:
  group: release-v0.1.15
  cancel-in-progress: false

env:
  NODE_VERSION: "22.22.2"
  REGISTRY: ghcr.io

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  gate:
    name: Gate - immutable v0.1.15 tag and exact-SHA candidate
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      sha: ${{ steps.gates.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      ciRunId: ${{ steps.gates.outputs.ciRunId }}
      candidateRunId: ${{ steps.gates.outputs.candidateRunId }}
      candidateAttempt: ${{ steps.gates.outputs.candidateAttempt }}
      candidateRef: ${{ steps.gates.outputs.candidateRef }}
      candidateDigest: ${{ steps.gates.outputs.candidateDigest }}
      candidateRepository: ${{ steps.gates.outputs.candidateRepository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require the exact Stable tag and package version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$TAG" = "v0.1.15" || { echo "::error::only annotated v0.1.15 may be promoted"; exit 1; }
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          version=$(node -p "require('./package.json').version")
          test "$version" = "0.1.15"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify six exact-SHA workflows, candidate evidence and remote tag immutability
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--phase tag --tag "$TAG" --version "$VERSION" --report artifacts/v0.1.15/release-gate.json)
          if [[ "$EVENT_NAME" == "push" ]]; then
            args+=(--event-sha "$GITHUB_SHA")
          fi
          node packaging/check-release-gates.mjs "${args[@]}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-gate-v0.1.15
          path: artifacts/v0.1.15/release-gate.json
          if-no-files-found: error
          retention-days: 30

  candidate:
    name: Download and verify the candidate bytes and attestations
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the candidate run selected by the gate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ needs.gate.outputs.candidateRunId }}
          CI_RUN_ID: ${{ needs.gate.outputs.ciRunId }}
        run: |
          set -euo pipefail
          for name in windows-x64 linux-x64 linux-arm64 cli-windows-x64 cli-linux-x64 cli-linux-arm64 cli-node22 release-candidate-evidence-v0.1.15; do
            gh run download "$CANDIDATE_RUN_ID" -n "$name" -D "candidate/$name"
          done
          gh run download "$CI_RUN_ID" -n release-evidence-v0.1.15 -D evidence-ci
      - name: Reverify resource evidence and candidate assets without rebuilding
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          VERSION: ${{ needs.gate.outputs.version }}
          CANDIDATE_RUN_ID: ${{ needs.gate.outputs.candidateRunId }}
          CANDIDATE_ATTEMPT: ${{ needs.gate.outputs.candidateAttempt }}
          CANDIDATE_REF: ${{ needs.gate.outputs.candidateRef }}
          CANDIDATE_DIGEST: ${{ needs.gate.outputs.candidateDigest }}
          CANDIDATE_REPOSITORY: ${{ needs.gate.outputs.candidateRepository }}
        run: |
          set -euo pipefail
          node packaging/verify-resource-evidence.mjs --commit "$SOURCE_SHA" --evidence-dir evidence-ci
          mkdir -p verified-promotion/release-assets verified-promotion/candidate-evidence
          find candidate -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} verified-promotion/release-assets/ \;
          test "$(find verified-promotion/release-assets -maxdepth 1 -type f | wc -l)" -eq 7
          cp candidate/release-candidate-evidence-v0.1.15/resource-evidence.json verified-promotion/release-assets/resource-evidence.json
          cp -a candidate/release-candidate-evidence-v0.1.15/. verified-promotion/candidate-evidence/
          node packaging/verify-disaster-recovery-evidence.mjs --commit "$SOURCE_SHA" --evidence-dir verified-promotion/candidate-evidence/disaster-recovery > verified-dr.json
          node -e 'const fs=require("fs");const m=require("./verified-promotion/candidate-evidence/candidate-manifest.json");const d=JSON.parse(fs.readFileSync("verified-dr.json"));if(m.disasterRecovery.gateSha256!==d.gateSha256||m.disasterRecovery.sumsSha256!==d.sumsSha256||m.disasterRecovery.verdict!=="PASS"||m.disasterRecovery.requirementCount!==50)process.exit(1)'
          node scripts/stage-resource-evidence.mjs \
            --evidence-dir evidence-ci \
            --runtime evidence-ci/resource-evidence-v0115.json \
            --doctor evidence-ci/resource-doctor.json \
            --dr-dir verified-promotion/candidate-evidence/disaster-recovery \
            --output verified-combined
          node packaging/release-evidence.mjs combine \
            --resource verified-combined/resource-evidence-v0115.json \
            --dr-dir verified-combined/disaster-recovery \
            --output verified-combined/resource-evidence.json \
            --source-sha "$SOURCE_SHA"
          node packaging/release-evidence.mjs verify-combined \
            --file verified-combined/resource-evidence.json \
            --dr-dir verified-combined/disaster-recovery \
            --source-sha "$SOURCE_SHA"
          cmp verified-combined/resource-evidence.json verified-promotion/release-assets/resource-evidence.json
          cp verified-promotion/candidate-evidence/SHA256SUMS verified-promotion/release-assets/SHA256SUMS
          node packaging/release-evidence.mjs verify \
            --dir verified-promotion/release-assets \
            --manifest verified-promotion/candidate-evidence/candidate-manifest.json \
            --attestations verified-promotion/candidate-evidence/attestations \
            --image-inspection verified-promotion/candidate-evidence/image-inspection.json \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$CANDIDATE_RUN_ID" \
            --attempt "$CANDIDATE_ATTEMPT"
          test "$CANDIDATE_REF" = "$(node -p "require('./verified-promotion/candidate-evidence/image.json').ref")"
          test "$CANDIDATE_DIGEST" = "$(node -p "require('./verified-promotion/candidate-evidence/image.json').digest")"
          test "$CANDIDATE_REPOSITORY" = "$(node -p "require('./verified-promotion/candidate-evidence/image.json').repository")"
          docker buildx imagetools inspect "$CANDIDATE_REF" --format '{{json .}}' > current-candidate-image.json
          docker buildx imagetools inspect "$CANDIDATE_REF" --raw > current-candidate-manifest.json
          node packaging/release-evidence.mjs normalize-inspection \
            --formatted current-candidate-image.json \
            --raw current-candidate-manifest.json \
            --digest "$CANDIDATE_DIGEST" \
            --output current-candidate-normalized.json
          node packaging/release-evidence.mjs image --inspection current-candidate-normalized.json --digest "$CANDIDATE_DIGEST" --image verified-promotion/candidate-evidence/image.json
          node packaging/candidate-attestations.mjs verify \
            --manifest verified-promotion/candidate-evidence/candidate-manifest.json \
            --dir verified-promotion/release-assets \
            --attestations verified-promotion/candidate-evidence/attestations \
            --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-promotion-v0.1.15
          path: verified-promotion/
          if-no-files-found: error

  draft:
    name: Create and verify the Stable draft Release
    needs: [gate, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-promotion-v0.1.15
          path: promotion
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the empty push draft or the nine-asset recovery draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: node packaging/check-release-draft.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --event "$EVENT_NAME"
      - name: Compose Stable release notes
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
          CANDIDATE_RUN_ID: ${{ needs.gate.outputs.candidateRunId }}
        run: |
          set -euo pipefail
          cat > release-body.md <<EOF
          Search Hub **v${VERSION}** — Stable release.

          Promoted without rebuilding from candidate run \`${CANDIDATE_RUN_ID}\` at exact
          source commit \`${SHA}\`. Windows x64, Linux x64/arm64 server packages, the
          standalone CLI packages and the linux/amd64 container passed their candidate gates.

          See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for changes
          and known limitations. Verify downloads with \`sha256sum -c SHA256SUMS\` and
          provenance with \`gh attestation verify <asset> --repo ${REPO}\`.
          EOF
      - name: Create or update only an empty draft
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          name: Search Hub v${{ needs.gate.outputs.version }}
          prerelease: false
          draft: true
          make_latest: false
          generate_release_notes: true
          body_path: release-body.md
          files: promotion/release-assets/*
          fail_on_unmatched_files: true
      - name: Download the draft assets and verify bytes and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,assets > draft-metadata.json
          jq -e '.isDraft == true and .isPrerelease == false and (.assets | length) == 9' draft-metadata.json >/dev/null
          jq -e '.assets | all(.state == "uploaded")' draft-metadata.json >/dev/null
          mkdir downloaded
          gh release download "$TAG" --dir downloaded
          test "$(find downloaded -maxdepth 1 -type f | wc -l)" -eq 9
          (cd downloaded && sha256sum -c SHA256SUMS)
          node packaging/candidate-attestations.mjs verify \
            --manifest promotion/candidate-evidence/candidate-manifest.json \
            --dir downloaded \
            --attestations promotion/candidate-evidence/attestations \
            --source-sha "$SOURCE_SHA"

  container:
    name: Promote the candidate GHCR digest without rebuilding
    needs: [gate, candidate, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-promotion-v0.1.15
          path: promotion
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Stable tags from the verified candidate digest
        id: promote
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.gate.outputs.candidateDigest }}
          EXPECTED_REPOSITORY: ${{ needs.gate.outputs.candidateRepository }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          base="${REGISTRY}/${owner}/search-hub"
          test "$base" = "$EXPECTED_REPOSITORY"
          refs=("${base}:${VERSION}" "${base}:v${VERSION}" "${base}:latest")
          for ref in "${refs[@]}"; do
            docker buildx imagetools create --tag "$ref" --prefer-index=false "${base}@${EXPECTED_DIGEST}"
          done
          for ref in "${refs[@]}"; do
            current=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | jq -r '.')
            test "$current" = "$EXPECTED_DIGEST"
            docker buildx imagetools inspect "$ref" --format '{{json .}}' > stable-image.json
            docker buildx imagetools inspect "$ref" --raw > stable-manifest.json
            node packaging/release-evidence.mjs normalize-inspection \
              --formatted stable-image.json \
              --raw stable-manifest.json \
              --digest "$EXPECTED_DIGEST" \
              --output stable-normalized.json
            node packaging/release-evidence.mjs image --inspection stable-normalized.json --digest "$EXPECTED_DIGEST" --image promotion/candidate-evidence/image.json
          done
          node packaging/candidate-attestations.mjs verify \
            --manifest promotion/candidate-evidence/candidate-manifest.json \
            --dir promotion/release-assets \
            --attestations promotion/candidate-evidence/attestations \
            --source-sha "$SOURCE_SHA"
          echo "digest=$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"

  finalize:
    name: Publish Stable only after draft and GHCR verification
    needs: [gate, candidate, draft, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-promotion-v0.1.15
          path: promotion
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and publish the Stable draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          EXPECTED_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,assets > before-publish.json
          jq -e '.isDraft == true and .isPrerelease == false and (.assets | length) == 9 and (.assets | all(.state == "uploaded"))' before-publish.json >/dev/null
          mkdir -p final-download
          gh release download "$TAG" --dir final-download
          test "$(find final-download -maxdepth 1 -type f | wc -l)" -eq 9
          (cd final-download && sha256sum -c SHA256SUMS)
          node packaging/candidate-attestations.mjs verify \
            --manifest promotion/candidate-evidence/candidate-manifest.json \
            --dir final-download \
            --attestations promotion/candidate-evidence/attestations \
            --source-sha "$SOURCE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > final-tag-ref.json
          tag_object=$(jq -er '.object.sha' final-tag-ref.json)
          expected_tag_object=$(git rev-parse "refs/tags/$TAG")
          test "$tag_object" = "$expected_tag_object"
          test "$(jq -r '.object.type' final-tag-ref.json)" = "tag"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" > final-tag-object.json
          test "$(jq -r '.object.sha' final-tag-object.json)" = "$SOURCE_SHA"
          test "$(jq -r '.object.type' final-tag-object.json)" = "commit"
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          base="${REGISTRY}/${owner}/search-hub"
          for ref in "${base}:0.1.15" "${base}:v0.1.15" "${base}:latest"; do
            current=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | jq -r '.')
            test "$current" = "$EXPECTED_DIGEST"
            docker buildx imagetools inspect "$ref" --format '{{json .}}' > final-image.json
            docker buildx imagetools inspect "$ref" --raw > final-manifest.json
            node packaging/release-evidence.mjs normalize-inspection \
              --formatted final-image.json \
              --raw final-manifest.json \
              --digest "$EXPECTED_DIGEST" \
              --output final-normalized.json
            node packaging/release-evidence.mjs image --inspection final-normalized.json --digest "$EXPECTED_DIGEST" --image promotion/candidate-evidence/image.json > final-image-verification.json
          done
          gh release view "$TAG" --json isDraft,isPrerelease,assets > before-publish.json
          jq -e '.isDraft == true and .isPrerelease == false and (.assets | length) == 9 and (.assets | all(.state == "uploaded"))' before-publish.json >/dev/null
          gh release edit "$TAG" --draft=false --latest
      - name: Confirm published Stable metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,tagName,assets > release-final.json
          jq -e '.isDraft == false and .isPrerelease == false and (.assets | length) == 9' release-final.json >/dev/null
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          test "$latest" = "$TAG"
          mkdir -p artifacts/v0.1.15
          cp release-final.json artifacts/v0.1.15/release-final.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("release-final.json"));const image=JSON.parse(fs.readFileSync("final-image-verification.json"));const ref=JSON.parse(fs.readFileSync("final-tag-ref.json"));const tag=JSON.parse(fs.readFileSync("final-tag-object.json"));x.ghcrDigest=process.argv[1];x.ghcrMediaType=image.mediaType;x.ghcrConfigDigest=image.configDigest;x.ghcrPlatform=image.platform;x.candidateRunId=Number(process.argv[2]);x.tag={name:x.tagName,tagObject:ref.object.sha,commit:tag.object.sha,type:tag.type};fs.writeFileSync("artifacts/v0.1.15/release-final.json",JSON.stringify(x,null,2)+"\n")' "$EXPECTED_DIGEST" "${{ needs.gate.outputs.candidateRunId }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-final-v0115
          path: |
            artifacts/v0.1.15/release-final.json
            final-tag-ref.json
            final-tag-object.json
          if-no-files-found: error
